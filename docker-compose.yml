x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  logging: *default-logging

services:
  caddy:
    image: caddy:2.11.4-alpine
    user: "65534:65534"
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be configured}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *default-logging

  api:
    <<: *app
    env_file:
      - .env
    environment:
      REDIS_URL: rediss://redis:6379/0?ssl_ca_certs=/run/secrets/redis_ca.crt
      PORT: 8000
    expose:
      - "8000"
    volumes:
      - ${REDIS_TLS_DIR:?REDIS_TLS_DIR must be configured}/ca.crt:/run/secrets/redis_ca.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.50

  worker:
    <<: *app
    env_file:
      - .env
    environment:
      REDIS_URL: rediss://redis:6379/0?ssl_ca_certs=/run/secrets/redis_ca.crt
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    command: python -m app.workers.delivery_worker
    volumes:
      - ${REDIS_TLS_DIR:?REDIS_TLS_DIR must be configured}/ca.crt:/run/secrets/redis_ca.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.50

  redis:
    image: redis:7.4.10-alpine
    user: "999"
    restart: unless-stopped
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --tls-auth-clients
      - "no"
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
      - ${REDIS_TLS_DIR:?REDIS_TLS_DIR must be configured}:/tls:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/tls/ca.crt", "-h", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    cpus: 0.50
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  receiver:
    <<: *app
    profiles: ["smoke"]
    command: python -m scripts.controlled_receiver --port 9090
    environment:
      OUTBOUND_WEBHOOK_SECRET: ${OUTBOUND_WEBHOOK_SECRET:?OUTBOUND_WEBHOOK_SECRET must be configured}
      SMOKE_CONTROL_SECRET: ${SMOKE_CONTROL_SECRET:?SMOKE_CONTROL_SECRET must be configured}
    expose:
      - "9090"
    mem_limit: 96m
    cpus: 0.25

volumes:
  redis_data:
  caddy_data:
  caddy_config:
